# No dependency runs install scripts, so a compromised package can't execute
# code during install. Nothing here needs them: esbuild and unrs-resolver ship
# platform binaries as optional dependencies, msgpackr falls back to
# JavaScript, and Chromium comes from the system (Docker) or, for local runs,
# `npx puppeteer browsers install chrome`.
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  msgpackr-extract: false
  puppeteer: false
  unrs-resolver: false

# Don't install a version until it has been public for a week. Compromised
# releases are usually caught and unpublished within hours, so waiting keeps
# them out of the lockfile.
minimumReleaseAge: 10080
