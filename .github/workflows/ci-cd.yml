name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      # The tests don't need a browser
      PUPPETEER_SKIP_DOWNLOAD: "true"
      MONGODB_TEST_URI: mongodb://localhost:27017/atomix-test
      REDIS_TEST_URL: redis://localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type-check and build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  docker:
    name: Build Docker image
    # Native arm64 runner: no QEMU, so the Raspberry Pi image builds in minutes
    runs-on: ubuntu-24.04-arm
    needs: [check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        # Pull requests build the image but don't publish it
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/atomix-to-notion:latest
            ${{ secrets.DOCKER_USERNAME }}/atomix-to-notion:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
